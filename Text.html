<!DOCTYPE html>
<html lang="pt-BR">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Texto</title>
    </head>

    <body>
        <h1>Meu primeiro título</h1>
        <h2>Meu segundo título</h2>
        <p>
            Este é o meu <strong>segundo</strong> parágrafo.
        </p>
        <blockquote>
            <I>Esta é uma citação.</I>
        </blockquote>
        <h2>Meu terceiro título</h2>
        <p>
            Este é o meu terceiro parágrafo.
        </p>
        <h2>Meu <u>quarto</u> título</h2>
        <p>
            <MARK>Este é o meu quarto parágrafo.</MARK>
        </p>
    </body>
</html>
