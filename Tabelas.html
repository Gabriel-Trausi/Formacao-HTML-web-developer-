<!DOCTYPE html>
<html lang="pt-br">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Tabelas</title>
        <style>
            table{
                box-shadow: 13px 16px 35px -1px rgba(0, 0, 0, 0.82);
                -webkit-box-shadow: 13px 16px 35px -1px rgba(0, 0, 0, 0.82);
                border: solid 1px red
            }

            table tr:nth-child(even) {
                background-color: black;
            }

            table tr:hover td {
                background-color: #ff0000;
                cursor: pointer;
            }

            table thead th{
                background-color: black;
                color: white;
                border: dashed 1px black;
            }

            table tbody{
                background-color: rgb(30, 29, 29);
                color: white;
            }

            table tfoot{
                background-color: black;
                color: white;
            }

            table caption{
                border: solid 1px red;
                background-color: black;
                color: white;
            }
        </style>
    </head>
    <body>
        <table summary="Coleta de dados" cellspacing="0" cellpadding="15" width="250" align="center">
            <caption align="center">Coleta de dados</caption>
            <thead>
            <tr>
                <th title="Nome completo">Nome</th>
                <th title="Idade">Idade</th>
            </tr>
            </thead>

            <tbody align="center">
                <tr id="1">
                    <td>Gabriel</td>
                    <td>23</td>
                </tr>

                <tr id="2">
                    <td>Luísa</td>
                    <td>31</td>
                </tr>

                <tr id="3">
                    <td>Guilherme</td>
                    <td>26</td>
                </tr>

                <tr id="4">
                    <td>Simone</td>
                    <td>64</td>
                </tr>

                <tr id="5">
                    <td>Sueli</td>
                    <td>68</td>
                </tr>

                <tr id="6">
                    <td>Walter</td>
                    <td>55</td>
                </tr>

                <tr id="7">
                    <td>José</td>
                    <td>69</td>
                </tr>
            </tbody>

            <tfoot>
                <tr>
                    <th>Total de pessoas</th>
                    <th>7</th>
                </tr>
            </tfoot>
        </table>
    </body>
</html>
