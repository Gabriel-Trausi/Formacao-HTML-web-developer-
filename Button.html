<!DOCTYPE html>
<html lang="pt-BR">
    <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Botões</title>
    </head>
    <body>
        <form>
            <button type="button" onclick="alert('Botão clicado!')">Clique aqui</button>
            <br>
            <button type="button" onmouseover="alert('Passe o mouse sobre mim!')">Passe o mouse sobre mim</button>
            <br>
            <button type="reset">Apagar</button>
            <br>
            <button type="submit">Enviar</button>
            <br>
            <button type="button" disabled>Desabilitado</button>
            </form>
    </body>
</html>
